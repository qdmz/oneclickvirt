services:
  oneclickvirt-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: oneclickvirt-web:latest
    container_name: oneclickvirt-web
    depends_on:
      - oneclickvirt-mysql
      - oneclickvirt-redis
      - oneclickvirt-api
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - oneclickvirt
