services:
  oneclickvirt-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: oneclickvirt-web:latest
    container_name: oneclickvirt-web
    depends_on:
      oneclickvirt-mysql:
        condition: service_healthy
      oneclickvirt-redis:
        condition: service_started
      oneclickvirt-api:
        condition: service_started
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - oneclickvirt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
