auth:
    enable-email: false
    enable-public-registration: false
    enable-qq: false
    enable-telegram: false
    enable-kyc: false
    telegram-bot-token: ""
    email-smtp-port: 587
    enable-checkin: false
    email-username: ""
    qq-app-id: ""
    email-password: ""
    enable-oauth2: false
    enable-domain: false
    qq-app-key: ""
    email-smtp-host: ""
captcha:
    enabled: false
    expire-time: 300
    height: 40
    length: 4
    width: 120
cdn:
    base-endpoint: https://cdn.spiritlhl.net/
    endpoints:
        - https://cdn0.spiritlhl.top/
        - http://cdn3.spiritlhl.net/
        - http://cdn1.spiritlhl.net/
        - http://cdn2.spiritlhl.net/
cors:
    mode: ""
    whitelist: []
invite-code:
    enabled: false
    required: false
jwt:
    buffer-time: 1d
    expires-time: 7d
    issuer: oneclickvirt
    signing-key: ""
mysql:
    auto-create: "true"
    config: charset=utf8mb4&parseTime=True&loc=Local&time_zone=%27%2B08%3A00%27
    db-name: oneclickvirt
    engine: InnoDB
    log-mode: error
    log-zap: "false"
    max-idle-conns: "50"
    max-lifetime: "900"
    max-open-conns: "500"
    password: ""
    path: 127.0.0.1
    port: 3306
    prefix: ""
    singular: "false"
    username: root
quota:
    default-level: 1
    level-limits:
        "1":
            max-instances: 1
            max-resources:
                bandwidth: 100
                cpu: 1
                disk: 1024
                memory: 350
            max-traffic: 102400
            expiry-days: 0
            max-snapshots: 1
        "2":
            max-instances: 3
            max-resources:
                bandwidth: 200
                cpu: 2
                disk: 20480
                memory: 1024
            max-traffic: 204800
            expiry-days: 0
            max-snapshots: 3
        "3":
            max-instances: 5
            max-resources:
                bandwidth: 500
                cpu: 4
                disk: 40960
                memory: 2048
            max-traffic: 307200
            expiry-days: 0
            max-snapshots: 5
        "4":
            max-instances: 10
            max-resources:
                bandwidth: 1000
                cpu: 8
                disk: 81920
                memory: 4096
            max-traffic: 409600
            expiry-days: 0
            max-snapshots: 10
        "5":
            max-instances: 20
            max-resources:
                bandwidth: 2000
                cpu: 16
                disk: 163840
                memory: 8192
            max-traffic: 512000
            expiry-days: 0
            max-snapshots: 20
    instance-type-permissions:
        min-level-for-delete-container: 2
        min-level-for-container: 1
        min-level-for-vm: 2
        min-level-for-delete-vm: 2
        min-level-for-reset-container: 2
        min-level-for-reset-vm: 2
redis:
    addr: ""
    db: 0
    password: ""
system:
    addr: 8888
    db-type: mysql
    env: production
    frontend-url: ""
    iplimit-count: 15000
    iplimit-time: 3600
    oauth2-state-token-minutes: 15
    oss-type: local
    provider-inactive-hours: 24
    use-multipoint: false
    use-redis: false
task:
    delete-retry-count: 3
    delete-retry-delay: 2
upload:
    max-avatar-size: 2
other:
    default-language: zh-CN
    max-avatar-size: 2
    site-name: 云虚拟化平台
    logo-url: ""
    icp-link: https://beian.miit.gov.cn/
    footer-text: © 2026 云虚拟化平台 保留所有权利
    icp-text: 粤ICP备2026000001号
    slogan: 极速开通 · 弹性计费 · 稳定可靠
zap:
    director: storage/logs
    encode-level: LowercaseLevelEncoder
    format: console
    level: info
    log-in-console: false
    max-array-elements: 5
    max-backups: 15
    max-file-size: 5
    max-log-length: 2000
    max-string-length: 1000
    prefix: '[oneclickvirt]'
    retention-day: 3
    show-line: false
    stacktrace-key: stacktrace
max_avatar_size: 2
default_language:
signing_key_v1:
    created_at: ""
    expires_at: ""
    is_active: false
    key: ""
    version: 1
active_version: 1
kyc:
    alipay-public-key: ""
    alipay-app-id: ""
    alipay-private-key: ""
    restrict-create-instance: false
    restrict-redeem-code: false
    method: manual
    restrict-domain-bind: false
    require-real-name: false
maintenance:
    optimize-after-cleanup: false
    data-cleanup-interval-hours: 24
    traffic-history-retention-days: 180
    audit-log-retention-days: 30
    cleanup-batch-size: 5000
    enable-data-cleanup: true
